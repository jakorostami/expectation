[package]
name = "expectation"
version = "0.6.1"
edition = "2021"
rust-version = "1.70"
authors = ["Jako Rostami <rostami.jako@gmail.com>"]
description = "Rust implementation of statistical functions for expectation library"
# GPL-3.0 with Additional Terms (AI/ML training restriction) — see LICENSE.
license-file = "LICENSE"
repository = "https://github.com/jakorostami/expectation"
readme = "README.md"
# Cargo target auto-discovery disabled so a stray examples/*.rs cannot be pulled
# into `cargo fmt --all` / `cargo clippy --all-targets` and break the Rust CI.
autoexamples = false
autobins = false
autobenches = false

[lib]
name = "expectation_rust"
# "cdylib" is required for Python extension modules
# "rlib" allows Rust code to use this crate as a library
crate-type = ["cdylib", "rlib"]
path = "rust/lib.rs"

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.22", features = ["abi3-py310"] }

# Numerical computation libraries
ndarray = "0.17"
numpy = "0.22"
rayon = "1.10"
thiserror = "2.0.17"

[dev-dependencies]
# Testing utilities
proptest = "1.5"
criterion = "0.5"

[profile.release]
# Optimization settings for production builds
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Faster compilation during development
opt-level = 0
debug = true

[profile.bench]
# Benchmarking profile
inherits = "release"
debug = true
