name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.ipynb'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - '**.ipynb'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pure-bash check (no Python/toolchain needed): fail fast with a clear
      # message instead of a cryptic cargo/maturin error deep in a later build.
      - name: Verify version consistency
        run: bash scripts/check_version.sh

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install linters
        run: pip install black isort mypy

      - name: black
        run: black --check --diff .

      - name: isort
        run: isort --check-only --diff .

      - name: mypy
        continue-on-error: true
        run: mypy

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      # Formatting is advisory: it reports drift without blocking, because the
      # existing source predates any rustfmt normalization. 
      - name: cargo fmt (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # cargo test links because pyo3's extension-module feature is NOT in
      # Cargo.toml default features (maturin injects it at build time).
      - name: cargo test
        run: cargo test --locked

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Create virtualenv
        run: |
          python -m venv .venv
          if [ -d .venv/bin ]; then
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build Rust extension
        run: maturin develop --release --locked

      # Performance-marked tests are excluded: hard timing thresholds are
      # flaky on shared runners. They run in the scheduled benchmark workflow.
      - name: Run tests
        run: pytest -m "not performance"

  min-deps:
    name: Minimum dependency bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Create virtualenv
        run: |
          python -m venv .venv
          if [ -d .venv/bin ]; then
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          fi

      # Verifies that the lower bounds in pyproject.toml are real: install the
      # floor version of every runtime dep and run the suite against it.
      - name: Install minimum dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install \
            "numpy==1.26" "scipy==1.12" "pydantic==2.5" \
            "pandas==2.2" "plotly==5.18" "matplotlib==3.8" \
            "pytest>=8.0" "maturin>=1.9"

      - name: Build Rust extension
        run: maturin develop --release --locked

      - name: Run tests
        run: pytest -m "not performance"
